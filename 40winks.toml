# Config file for 40 Winks (final release, sha1 282b97c6a6eb79535e618fc2651b6156fff65ea4) recompilation

[input]
entrypoint = 0x80000400
trace_mode = false  # debug: call tracing, see include/trace.h (set to false for normal builds)
# Paths are relative to the location of this config file.
# The ELF comes from decomp/ (splat + tools/build_rom.py, byte-matching rebuild of the ROM).
elf_path = "decomp/build/40winks.elf"
output_func_path = "RecompiledFuncs"

[patches]
stubs = [
    # Handwritten CP0 code at the end of .text, never called; it jumps to 0x84001064, which is not code.
    "func_80080030",
]
ignored = [
    # libultra internal never called (func_80041590 / func_800416E8 are recompiled now, called by osPfsChecker_40w)
    "func_80041850",
]

# Controller Pak (src/game/pak.cpp): on hardware osMotorInit fails with PFS_ERR_DEVICE (0xB) on a port that holds a
# Controller Pak; the runtime's osMotorInit succeeds on every connected controller. Same result as hardware, after both
# calls (func_8002ABA4 = rumble init of port $s0; func_8002DA00 = request 13 of the pak thread, port in D_80128500).
[[patches.hook]]
func = "func_8002ABA4"
text = "{ extern int forty_pak_present(int); if (forty_pak_present((int)ctx->r16)) ctx->r2 = 0xB; }"
before_vram = 0x8002ABF4

[[patches.hook]]
func = "func_8002DA00"
text = "{ extern int forty_pak_present(int); if (forty_pak_present(MEM_W(0, (gpr)(int32_t)0x80128500))) ctx->r2 = 0xB; }"
before_vram = 0x8002DFAC

# func_800091A4 picks the audio rate from osTvType: PAL 22050 Hz / 50 fps, else 26461 Hz / 60 fps. The game is built for
# 22050 Hz (the 26461 Hz branch plays 1.2x too fast and too high), but PAL video modes break rendering, so keep NTSC
# video and force the PAL values (22050 Hz, 50 fps) before the store of the rate. The VI thread runs at 50 Hz (events.cpp).
[[patches.hook]]
func = "func_800091A4"
text = "ctx->r3 = 22050; ctx->r2 = 0x32;"
before_vram = 0x800091F0

# RT64 frame interpolation: the display list of a frame starts at D_801D06C0's list (task data_ptr), and func_80002F20 ends
# its setup with D_801D06C0 = write cursor. src/game/interpolation.cpp appends gEXEnable, gEXSetRefreshRate(25) and an
# identity matrix there.
[[patches.hook]]
func = "func_80002F20"
text = "{ extern void winks_frame_start(uint8_t*); winks_frame_start(rdram); }"
before_vram = 0x800030AC

# RT64 matrix groups (src/game/interpolation.cpp): one group per 3D object, id = object data pointer (its matrix is at
