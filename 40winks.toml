before_vram = 0x8000765C

[[patches.hook]]
func = "func_800074C0"
text = "{ extern void winks_hud2p_end(uint8_t*); winks_hud2p_end(rdram); }"
before_vram = 0x80007998

# Portal scissors widened for interpolated frames (src/game/interpolation.cpp, winks_portal_scissor): union of this and
# last frame's rectangle per room. $a0 = G_SETSCISSOR command (word 0 stored), $v1 = word 1 (stored in the delay slot),
# $s2 = loop index, room id = byte at $s1 - 8.
[[patches.hook]]
func = "func_80019220"
text = "{ extern uint32_t winks_portal_scissor(uint8_t*, uint32_t, uint32_t, uint32_t, uint32_t); ctx->r3 = winks_portal_scissor(rdram, (uint32_t)ctx->r18, MEM_BU(-8, ctx->r17), (uint32_t)ctx->r4, (uint32_t)ctx->r3); }"
before_vram = 0x8001978C
