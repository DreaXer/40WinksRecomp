# The start hook goes after func_80024078, which sets the 4:3 scissor (G_SETSCISSOR from the viewport bounds).
[[patches.hook]]
func = "func_800079D0"
text = "{ extern void winks_hud_start(uint8_t*); winks_hud_start(rdram); }"
before_vram = 0x80007ADC

# Counter $s1 of the loop: D_80082620[$s1].x (12-byte entries) < 0 on the left side, > 0 on the right side.
[[patches.hook]]
func = "func_800079D0"
text = "{ extern void winks_hud_align(uint8_t*, int); winks_hud_align(rdram, MEM_W(0, (gpr)(int32_t)(0x80082620 + ctx->r17 * 12)) < 0 ? -1 : 1); }"
before_vram = 0x80007C10

# func_80007104 draws a centered counter.
[[patches.hook]]
func = "func_800079D0"
text = "{ extern void winks_hud_align(uint8_t*, int); winks_hud_align(rdram, 0); }"
before_vram = 0x80007D3C

[[patches.hook]]
func = "func_800079D0"
text = "{ extern void winks_hud_end(uint8_t*); winks_hud_end(rdram); }"
before_vram = 0x80007D4C

# func_800071D0: per-player counters from D_80082770 (1P: x = 28, left side). winks_hud_align does nothing outside the 1P HUD.
