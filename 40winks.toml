text = "{ extern void winks_particles_group_end(uint8_t*); winks_particles_group_end(rdram); }"
before_vram = 0x80012EFC

# func_80002320 times a frame by spinning on a counter (D_801CD0C0) that another thread increments.
# On N64 the VI interrupt preempts the loop; ultramodern only switches threads on OS calls, so yield inside both loops.
[[patches.hook]]
func = "func_80002320"
text = "{ extern void yield_self_1ms(uint8_t*); yield_self_1ms(rdram); }"
before_vram = 0x80002344

[[patches.hook]]
func = "func_80002320"
text = "{ extern void yield_self_1ms(uint8_t*); yield_self_1ms(rdram); }"
before_vram = 0x80002378

# Same pattern: spins until D_800827E0 changes.
[[patches.hook]]
func = "func_80002E78"
text = "{ extern void yield_self_1ms(uint8_t*); yield_self_1ms(rdram); }"
before_vram = 0x80002E90

