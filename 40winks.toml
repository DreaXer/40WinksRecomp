# func_80013A38 (patched in the final release) dispatches on the asset type with "jal f; addiu $ra, $ra, N" so that
# f returns straight to the epilogue. N64Recomp returns to the next instruction instead, so do the call and jump to
# the epilogue explicitly. (type 3, the LZ decompressor at 0x80013A80, already falls through to the epilogue.)
[[patches.hook]]
func = "func_80013A38"
text = "func_80012F10(rdram, ctx); goto L_80013A8C;"
before_vram = 0x80013A70

[[patches.hook]]
func = "func_80013A38"
text = "func_800139A8(rdram, ctx); goto L_80013A8C;"
before_vram = 0x80013A78

# func_80006F90: a switch inside a loop compiled as "lw $v0, 0($a1); jr $v0" with $a1 walking jtbl_800A7ED0 (not the
# base + index*4 pattern N64Recomp detects), so it became an unresolved indirect call. Dispatch the two cases here.
[[patches.hook]]
func = "func_80006F90"
text = """{
        uint32_t target = (uint32_t)MEM_W(0, ctx->r5);
        ctx->r2 = (gpr)(int32_t)target;
        if (target == 0x80007018) {
            MEM_W(0, (gpr)(int32_t)(0x801CD0E4 + (uint32_t)ctx->r3)) = 0;
            MEM_W(0, (gpr)(int32_t)(0x801CD0F0 + (uint32_t)ctx->r3)) = (int32_t)ctx->r11;
        } else if (target == 0x80007038) {
            MEM_W(0, (gpr)(int32_t)(0x801CD0E4 + (uint32_t)ctx->r3)) = (int32_t)ctx->r10;
            MEM_W(0, (gpr)(int32_t)(0x801CD0F0 + (uint32_t)ctx->r3)) = (int32_t)ctx->r10;
        } else {
            switch_error(__func__, 0x80007010, 0x800A7ED0);
        }
        ctx->r3 = ADD32(ctx->r3, 0x24);
        goto L_80007054;
    }"""
before_vram = 0x8000700C

# Game views filling the 4:3 screen. 1P = whole screen; 2P: P1 = left half, P2 = right half, full height, no border.
# D_80086FF0 holds 3 screen rectangles {center x, center y, width, height} as fractions of the framebuffer (1P, 2P P1,
# 2P P2). func_80010B68 builds the viewports D_80086FC0 from it; func_80010C70 picks one per player (count D_800A346C,
# current player D_800A3468) and emits viewport + scissor. Original rects: 1P 0.9125 x 1.0078 (292 pixels wide, black
# bands left and right); 2P 0.45625 x 0.46875, centered at x 0.271875 and 0.725 (146x112 views, black bands and a gap).
[[patches.hook]]
func = "func_80010B68"
text = """{
        MEM_W(0, (gpr)(int32_t)0x80086FF8) = 0x3F800000; MEM_W(0, (gpr)(int32_t)0x80086FFC) = 0x3F800000;  // 1P size 1.0, 1.0
        MEM_W(0, (gpr)(int32_t)0x80087000) = 0x3E800000; MEM_W(0, (gpr)(int32_t)0x80087004) = 0x3F000000;  // P1 center 0.25, 0.5
        MEM_W(0, (gpr)(int32_t)0x80087008) = 0x3F000000; MEM_W(0, (gpr)(int32_t)0x8008700C) = 0x3F800000;  // P1 size 0.5, 1.0
        MEM_W(0, (gpr)(int32_t)0x80087010) = 0x3F400000; MEM_W(0, (gpr)(int32_t)0x80087014) = 0x3F000000;  // P2 center 0.75, 0.5
        MEM_W(0, (gpr)(int32_t)0x80087018) = 0x3F000000; MEM_W(0, (gpr)(int32_t)0x8008701C) = 0x3F800000;  // P2 size 0.5, 1.0
    }"""
before_vram = 0x80010B68

# func_80010C70 insets the scissor by 1 pixel on each side (black border, 2-pixel black line between the 2P views).
# Replace it with the exact view: whole screen in 1P, half screen in 2P. ulx $a0, uly $t0, lrx $a3, lry $a2 (pixels), also
# kept in D_8012AAF0 / D_8012E410 / D_8012BFC8 (D_80132270 is stored from $a2 after this point). Width D_801CD8D0,
# height D_801321A8.
[[patches.hook]]
func = "func_80010C70"
text = """{
        int32_t w = MEM_W(0, (gpr)(int32_t)0x801CD8D0), h = MEM_W(0, (gpr)(int32_t)0x801321A8);
        int split = MEM_W(0, (gpr)(int32_t)0x800A346C) == 2, p2 = split && MEM_W(0, (gpr)(int32_t)0x800A3468) != 0;
        ctx->r4 = p2 ? w / 2 : 0; ctx->r8 = 0; ctx->r7 = (split && !p2) ? w / 2 : w; ctx->r6 = h;
        MEM_W(0, (gpr)(int32_t)0x8012AAF0) = (int32_t)ctx->r4;
        MEM_W(0, (gpr)(int32_t)0x8012E410) = (int32_t)ctx->r8;
        MEM_W(0, (gpr)(int32_t)0x8012BFC8) = (int32_t)ctx->r7;
    }"""
before_vram = 0x80010F30

# func_800104F0 (game camera) picks the perspective aspect in $f22: 4/3, or 16/9 when D_8008708C = 1 (built-in 16:9 option,
# toggled by func_80010C3C). The 2P views are half as wide as the screen at full height: halve the aspect.
[[patches.hook]]
func = "func_800104F0"
text = "if (MEM_W(0, (gpr)(int32_t)0x800A346C) == 2) ctx->f22.fl *= 0.5f;"
before_vram = 0x80010578

# Aspect Ratio Expand: RT64 widens the 3D drawn with the fixed-point projection (func_800353A0), but the float one
# (func_800351F0, into D_80127E10, then D_80130C68) feeds the portal visibility (func_80018870 / func_80018ADC). Widen
# only that one ($a3 = aspect), so rooms whose doorway is outside the 4:3 frame are still drawn.
[[patches.hook]]
func = "func_800104F0"
text = "{ extern float winks_expand_factor(void); union { float f; uint32_t u; } a; a.f = ctx->f22.fl * winks_expand_factor(); ctx->r7 = (int32_t)a.u; }"
before_vram = 0x800105A8

# Aspect Ratio Expand: func_800140FC builds the view pyramid that clips portals and rooms (planes D_801CD400, via
# func_80014A14) from hardcoded half-angles: 39 degrees horizontal (48 with the built-in 16:9 option), 32 vertical.
# $f30 = tan(horizontal half-angle) * far, just computed: widen it like the screen.
[[patches.hook]]
func = "func_800140FC"
text = "{ extern float winks_expand_factor(void); ctx->f30.fl *= winks_expand_factor(); }"
before_vram = 0x8001419C

# HUD on the screen edges in Aspect Ratio Expand (subject I, src/game/interpolation.cpp). func_800079D0 draws the HUD;
