# id = 0x54 tag | slot offset ($s0, already advanced by 8). func_80012C48 has no other caller: the group ends at its epilogue.
[[patches.hook]]
func = "func_80012C00"
text = "{ extern void winks_particles_group(uint8_t*, uint32_t); winks_particles_group(rdram, 0x54000000 | ((uint32_t)ctx->r16 & 0xFFFFFF)); }"
